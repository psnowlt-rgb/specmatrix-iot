<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpecMatrix IoT - Parts Specification Matrix</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useMemo, useState } = React;

const Icon = ({ children, className }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
);
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const Copy = (p) => <Icon {...p}><rect x="8" y="8" width="14" height="14" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></Icon>;
const Cpu = (p) => <Icon {...p}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2" /></Icon>;
const Layers = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></Icon>;

const P = (id, name, category, m, o) => ({ id, name, category, mandatory: m.map(parse), optional: o.map(parse) });
function parse(s) { const i = s.indexOf("|"); return i < 0 ? { name: s } : { name: s.slice(0, i), detail: s.slice(i + 1) }; }

const PARTS = [
  P("screws", "Screws & Threaded Fasteners", "Mechanical Components",
    ["Fastener Type|e.g., Hex Bolt, Set Screw","Standard|e.g., ISO, DIN, ANSI, JIS","Thread Size|Diameter & Pitch / TPI","Length|End-to-end or under-head","Material|e.g., Carbon Steel, Brass, Nylon","Grade / Property Class|e.g., 8.8, Grade 5","Head Style|If no ISO/DIN standard is used","Drive Style|For screws or socket heads"],
    ["Coating / Finish|e.g., Zinc Plated, Plain, Teflon","Thread Coverage|Fully vs. Partially Threaded","Thread Direction|Left-Hand Thread, if applicable","Point Style|e.g., Self-Drilling, Cup Point","Certifications & Compliance|e.g., RoHS, MTRs","Locking Features|e.g., Pre-applied threadlocker"]),
  P("enclosures", "Device Enclosures & Housings", "Mechanical Components",
    ["Enclosure Dimensions|L x W x H in mm","Material & Resin Grade|Polycarbonate, ABS, Extruded Al","Ingress Protection IP Rating|IP67, IP68, IP65","Mounting Style|DIN-rail, Wall Flange, Magnetic","Lid Fastening Method|Captive screws, Latches"],
    ["Flammability Rating|UL 94 V-0","Outdoor UV Resistance|UL 746C f1","Gasket & Sealing Material|Silicone, PU Foam","Cutouts / Knockouts|SMA, Cable Gland, RJ45","Finish / RAL Color"]),
  P("standoffs", "PCB Standoffs & Spacers", "Mechanical Components",
    ["Thread Size|M2.5, M3, 4-40","Body Length / Clearance Height|5mm, 8mm, 10mm","Gender|Male-Female, Female-Female","Material|Nickel-plated Brass, Nylon 6/6"],
    ["Male Stud Length","Hex Width A/F","Plating / Finish","RoHS / REACH"]),
  P("gappads", "Thermal Interface Gap Pads", "Mechanical Components",
    ["Thermal Conductivity|1.5 - 6.0 W/m·K","Thickness|0.5mm - 2.0mm","Dielectric Breakdown|>5 kV/mm","Dimensions|L x W"],
    ["Durometer Hardness|30 Shore 00","Silicone-Free Acrylic|zero optical outgas","Operating Temp Range|-40°C to +150°C"]),
  P("modems", "Cellular Wireless Modems", "Active Silicon",
    ["Cellular Category|LTE-M, NB-IoT, Cat 1 bis, Cat 4, 5G RedCap","Target Geographic Bands|Global, NA B2/B4/B12, EMEA B3/B7/B20","Form Factor|LGA SMT, Mini PCIe, M.2","Host Interface|UART AT, USB 2.0 HS","Supply Voltage|3.3V - 4.3V"],
    ["Integrated GNSS Receiver","Carrier Certifications|PTCRB, FCC, AT&T, Verizon","Sleep Current|PSM < 3.5µA","eSIM / eUICC Support"]),
  P("mcu", "Microcontrollers & SoCs", "Active Silicon",
    ["Core Family|Cortex-M4, Cortex-M33, ESP32, RISC-V","Internal Flash Size|256KB - 2MB for FOTA","Internal SRAM|64KB - 512KB","Package & Pinout|QFN-32, LQFP-48, BGA-64","Operating Voltage|1.8V - 3.6V"],
    ["Peripherals|UART, SPI, I2C, CAN-FD, ADC channels","Deep Sleep Current|<1.5µA with RTC","Crypto Accelerator|AES-256, ECC for TLS 1.3"]),
  P("pmic", "Power Management ICs / DC-DC", "Active Silicon",
    ["Topology|Synchronous Buck, Boost, LDO","Input Voltage Range|4.5V - 36V industrial or 2.5V - 5.5V Li-ion","Output Voltage|Fixed 3.3V, 3.8V or Adj","Continuous & Peak Output Current|500mA - 3A peak","Package|SOT-23, DFN-6, QFN-16"],
    ["Quiescent Current|<1µA Iq","Switching Frequency|1.2MHz, 2.1MHz","Protection|Thermal shutdown, UVLO"]),
  P("mlcc", "Ceramic MLCC Capacitors", "Passive Components",
    ["Capacitance|100nF, 10µF, 22µF","Rated DC Voltage|6.3V, 16V, 25V, 50V","Package Size|0402, 0603, 0805, 1206","Dielectric Type|X7R, X5R, C0G/NP0","Tolerance|±10%, ±20%, ±5%"],
    ["Reel Packaging|7\" Tape & Reel","Automotive Qualification|AEC-Q200","DC Bias Derating","Termination Metallurgy"]),
  P("resistors", "SMD Chip Resistors", "Passive Components",
    ["Resistance Value|10k, 4.7k, 100k, 10mΩ shunt, 0Ω","Tolerance|±1%, ±0.1%, ±5%","Power Rating|1/16W, 1/10W, 1/8W, 1W","Package Size|0402, 0603, 0805, 2512"],
    ["Temperature Coefficient TCR|±100ppm/°C, ±25ppm/°C","Technology|Thick Film vs Thin Film","AEC-Q200"]),
  P("inductors", "Power Inductors", "Passive Components",
    ["Inductance|1.0µH, 2.2µH, 4.7µH, 10µH","Saturation Current Isat|1.5A, 3.0A, 4.5A","Shielding Type|Molded Metal Composite, Fully Shielded","Footprint|2016, 2520, 4040"],
    ["DC Resistance DCR Max|<35mΩ","SRF","AEC-Q200"]),
  P("crystals", "Quartz Crystals & RTC", "Passive Components",
    ["Nominal Frequency|32.768 kHz, 26.000 MHz, 32.000 MHz","Load Capacitance CL|6pF, 9pF, 12.5pF","Stability / Tolerance|±10ppm, ±20ppm, or ±0.5ppm TCXO","Package|2012, 2520, 3225","Type|Passive Crystal vs Active TCXO"],
    ["ESR Max|<50kΩ for RTC","Drive Level|<0.5µW","Temp Range|-40°C to +85°C"]),
  P("mems", "MEMS Motion Sensors", "Sensors",
    ["Type & Axes|3-Axis Accelerometer vs 6-Axis IMU","Full-Scale Range|±2g / ±4g / ±8g / ±16g","Low-Power Sleep Current|<1µA wake-on-motion","Interface|I2C, SPI","Package|LGA-12, LGA-14"],
    ["Interrupt Pins|INT1, INT2 for motion wake-up","FIFO Buffer Size","Operating Temp"]),
  P("rfconn", "Micro-Coaxial RF Connectors", "Connectors",
    ["Connector Standard|Hirose U.FL / I-PEX MHF I, MHF4, SMA Bulkhead, RP-SMA","Characteristic Impedance|50 Ω, up to 6 GHz","Mounting Style|SMT Receptacle vs Panel Mount with O-Ring"],
    ["Mated Height|2.5mm Max, 1.4mm Max","IP67 Ingress Seal","Mating Durability Cycles|30 vs 500"]),
  P("sim", "SIM Sockets & eSIM", "Connectors",
    ["SIM Form Factor|Nano-SIM 4FF, Micro-SIM 3FF, Soldered eSIM MFF2","Ejection Style|Hinged Clamshell for vibration vs Push-Pull","Profile Height|1.35mm, 1.50mm, 2.50mm"],
    ["Card Detect (CD) Switch|NO/NC","Gold Contact Plating","Industrial Temp"]),
  P("batteries", "Primary & Rechargeable Lithium Batteries", "Power Storage",
    ["Chemistry & Voltage|Li-SOCl2 3.6V primary vs Li-Po 3.7V rechargeable","Nominal Capacity|2700mAh AA, 8500mAh C, 2000mAh pouch","Dimensions|Max L x W x Thickness mm","Lead Termination|JST PH 2.0mm vs PCB Solder Pins","Protection Circuit|Integrated PCM for overcharge/discharge/short"],
    ["Pulse Current Capability|Hybrid Pulse Capacitor HPC for 2A cellular pulses","NTC Thermistor Wire","UN 38.3 Safety Certification"]),
  P("antennas", "Cellular & GNSS Antennas", "Antennas & RF",
    ["Frequency Bands|Wideband 4G LTE 698-960 & 1710-2690 MHz, GNSS L1/L5","Form Factor|Internal Flex FPC vs Ceramic Patch vs External Whip","Connector & Cable Length|U.FL with 100mm micro-coax","Mounting Adhesive|3M 467MP"],
    ["Active GNSS|integrated 28dB LNA vs Passive Patch","Patch Dimensions|25x25x4mm","Ground Plane Independence"]),
  P("pcb", "Bare PCB Fabrication", "PCB Manufacturing",
    ["Layer Count|4 Layers RF, 6 Layers, 2 Layers","Board Thickness|1.6mm ±10%, 1.0mm","Surface Finish|ENIG Electroless Nickel Immersion Gold mandatory for LGA/BGA","Laminate Tg|High-Tg FR-4 Tg ≥ 170°C for lead-free reflow","Controlled Impedance|50Ω single-ended, 90Ω differential pairs"],
    ["Copper Weight|1 oz outer / 1 oz inner","Acceptance Standard|IPC-A-600 Class 2 / Class 3","Solder Mask Color"]),
];
const CATEGORIES = Array.from(new Set(PARTS.map((p) => p.category)));

const Cell = ({ spec, index }) => (
  <div className={`px-4 py-2.5 min-h-[42px] flex items-center transition-colors hover:bg-cyan-950/30 ${index % 2 === 0 ? "bg-slate-950/70" : "bg-slate-900/60"}`}>
    {spec ? (
      <p className="leading-snug">
        <span className="font-semibold text-white text-[13px]">{spec.name}</span>
        {spec.detail && <span className="text-slate-400 font-normal text-[12.5px]"> ({spec.detail})</span>}
      </p>
    ) : <span className="text-slate-700">—</span>}
  </div>
);

function App() {
  const [selectedId, setSelectedId] = useState(PARTS[0].id);
  const [copied, setCopied] = useState(false);
  const part = useMemo(() => PARTS.find((p) => p.id === selectedId) || PARTS[0], [selectedId]);
  const maxRows = Math.max(part.mandatory.length, part.optional.length);

  const handleCopy = async () => {
    const fmt = (s) => `• ${s.name}${s.detail ? ` (${s.detail})` : ""}`;
    const text = [
      `${part.name} [${part.category}]`, "",
      `MANDATORY SPECIFICATIONS (${part.mandatory.length})`, ...part.mandatory.map(fmt), "",
      `OPTIONAL SPECIFICATIONS (${part.optional.length})`, ...part.optional.map(fmt),
    ].join("\n");
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) { setCopied(false); }
  };

  return (
    <div className="min-h-screen text-slate-200 bg-fixed bg-cover" style={{ backgroundColor: "#020617", backgroundImage: "linear-gradient(rgba(34,211,238,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.05) 1px, transparent 1px)", backgroundSize: "32px 32px" }}>
      <div className="min-h-screen bg-slate-900/35">
        <div className="max-w-6xl mx-auto px-4 py-6 sm:py-10 space-y-6">
          <header className="flex flex-wrap items-center justify-between gap-4 rounded-lg border border-cyan-500/30 bg-slate-950/85 px-5 py-4">
            <div className="flex items-center gap-3">
              <div className="p-2 rounded-md border border-cyan-500/30 bg-slate-900/90"><Cpu className="w-5 h-5 text-cyan-400" /></div>
              <div>
                <h1 className="text-lg font-bold text-white leading-tight">Parts Specification Matrix</h1>
                <p className="text-xs text-slate-400">IoT Engineering & Procurement Checklist</p>
              </div>
            </div>
            <button onClick={handleCopy} className="inline-flex items-center gap-2 rounded-md border border-cyan-500/40 bg-slate-900/90 px-4 py-2 text-sm font-medium text-cyan-300 hover:bg-cyan-950/50 focus:outline-none focus:ring-2 focus:ring-cyan-400">
              {copied ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
              {copied ? "Copied!" : "Copy Specs"}
            </button>
          </header>

          <section className="rounded-lg border border-cyan-500/30 bg-slate-950/85 p-5">
            <label htmlFor="part-select" className="block text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">Select component</label>
            <div className="flex flex-wrap items-center gap-3">
              <select id="part-select" value={selectedId} onChange={(e) => setSelectedId(e.target.value)} className="flex-1 min-w-[260px] rounded-md border border-cyan-500/30 bg-slate-900 px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-400">
                {CATEGORIES.map((cat) => (
                  <optgroup key={cat} label={cat}>
                    {PARTS.filter((p) => p.category === cat).map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </optgroup>
                ))}
              </select>
              <span className="inline-flex items-center gap-1.5 rounded-full border border-cyan-500/40 bg-cyan-950/40 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-cyan-300">
                <Layers className="w-3.5 h-3.5" />{part.category}
              </span>
            </div>
          </section>

          <section className="rounded-lg border border-cyan-500/30 overflow-hidden bg-slate-950/85">
            <div className="grid grid-cols-2">
              <div className="flex items-center gap-2 px-4 py-3 bg-gradient-to-r from-slate-950 via-[#0c1f2a] to-slate-900 border-b border-cyan-500/30">
                <span className="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_6px_#22d3ee]" />
                <span className="text-xs font-bold uppercase tracking-widest text-cyan-400">Mandatory Specifications</span>
                <span className="text-cyan-400 text-[10px]">▼</span>
                <span className="ml-auto text-xs font-semibold text-cyan-300">{part.mandatory.length}</span>
              </div>
              <div className="flex items-center gap-2 px-4 py-3 bg-gradient-to-r from-slate-900 via-[#101b24] to-slate-950 border-b border-cyan-500/30 border-l border-slate-800/80">
                <span className="w-2 h-2 rounded-full bg-slate-300" />
                <span className="text-xs font-bold uppercase tracking-widest text-slate-300">Optional Specifications</span>
                <span className="text-slate-400 text-[10px]">▼</span>
                <span className="ml-auto text-xs font-semibold text-slate-300">{part.optional.length}</span>
              </div>
            </div>
            <div className="grid grid-cols-2 divide-y divide-slate-800/80">
              {Array.from({ length: maxRows }).map((_, i) => (
                <React.Fragment key={part.id + "-" + i}>
                  <div><Cell spec={part.mandatory[i]} index={i} /></div>
                  <div className="border-l border-slate-800/80"><Cell spec={part.optional[i]} index={i} /></div>
                </React.Fragment>
              ))}
            </div>
          </section>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
